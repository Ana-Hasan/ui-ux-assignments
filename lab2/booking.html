<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Trip</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Thapar Travels</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="packages.html">Packages</a>
        <a href="booking.html">Book Now</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About Us</a>
    </nav>
</header>

<main>

<h2>Book Your Trip</h2>

<form>

    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone">

    <label for="destination">Destination:</label>

    <select id="destination" name="destination">
        <option value="">Select Destination</option>
        <option value="paris">Paris</option>
        <option value="bali">Bali</option>
        <option value="dubai">Dubai</option>
        <option value="switzerland">Switzerland</option>
    </select>

    <label for="package">Select Package:</label>

    <select id="package" name="package">
        <option value="luxury">Luxury</option>
        <option value="adventure">Adventure</option>
        <option value="premium">Premium</option>
    </select>

    <label for="departure">Departure Date:</label>
    <input type="date" id="departure" name="departure">

    <label for="return">Return Date:</label>
    <input type="date" id="return" name="return">

    <label for="people">Number of Travelers:</label>
    <input type="number" id="people" name="people" min="1" max="20">

    <p>Travel Class:</p>

    <label>
        <input type="radio" name="class" value="economy">
        Economy
    </label>

    <label>
        <input type="radio" name="class" value="business">
        Business
    </label>

    <label>
        <input type="radio" name="class" value="first">
        First Class
    </label>

    <label for="requests">Special Requests:</label>
    <textarea id="requests" name="requests"></textarea>

    <label>
        <input type="checkbox" required>
        I agree to the terms and conditions
    </label>

    <button type="submit">Book Now</button>

</form>

</main>

</body>
</html>
